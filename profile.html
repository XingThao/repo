<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อมูลบุคลากร — มหาวิทยาลัยราชภัฏศรีสะเกษ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#1b3d6f; --prid:#0f2547; --pril:#2a5cad;
  --gld:#c9a53b; --glll:#e8c96a;
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;font-family:'Sarabun',sans-serif;background:linear-gradient(160deg,var(--prid),var(--pri) 55%,#1e4585);
  color:#1e293b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
h1,h2,h3{font-family:'Prompt',sans-serif;}

.card{background:#fff;border-radius:18px;width:100%;max-width:420px;box-shadow:0 14px 50px rgba(0,0,0,.35);overflow:hidden;}
.head{background:linear-gradient(135deg,var(--prid),var(--pri) 60%,#2a5cad);padding:30px 24px 60px;text-align:center;position:relative;}
.head .uni{color:rgba(255,255,255,.65);font-size:11.5px;letter-spacing:.3px;margin-bottom:2px;}
.head .sys{color:rgba(255,255,255,.9);font-size:13px;font-weight:600;}

.avwrap{margin:-46px auto 0;width:96px;height:96px;position:relative;z-index:2;}
.avimg{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.2);display:block;}
.avph{width:96px;height:96px;border-radius:50%;background:#eef2f8;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.2);
  display:flex;align-items:center;justify-content:center;font-size:36px;color:#94a3b8;}

.body{padding:16px 26px 26px;text-align:center;}
.nm{font-family:'Prompt',sans-serif;font-size:19px;font-weight:700;color:var(--pri);margin:4px 0 2px;}
.pos{font-size:13.5px;color:#64748b;margin-bottom:14px;}
.pos b{color:#334155;}

.tag{display:inline-block;background:#eef2f8;color:var(--pri);font-size:11.5px;font-weight:600;
  padding:4px 12px;border-radius:20px;margin:2px 3px;}

.divider{height:1px;background:#eef1f5;margin:16px 0;}

.rows{text-align:left;}
.row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f4f6fa;font-size:13.5px;align-items:flex-start;}
.row:last-child{border-bottom:none;}
.row .ic{width:20px;text-align:center;flex-shrink:0;}
.row .lv{color:#64748b;font-size:11px;display:block;}
.row .vv{color:#1e293b;font-weight:500;word-break:break-word;}

.foot{text-align:center;padding:14px;font-size:11px;color:#94a3b8;background:#fafbfc;border-top:1px solid #f1f5f9;}

#loading, #errBox{color:#fff;text-align:center;font-size:14px;}
#errBox{display:none;}
</style>
</head>
<body>

<div class="card" id="mainCard" style="display:none;">
  <div class="head">
    <div class="uni">มหาวิทยาลัยราชภัฏศรีสะเกษ</div>
    <div class="sys">ข้อมูลบุคลากร</div>
  </div>
  <div class="avwrap">
    <img id="avImg" class="avimg" style="display:none;">
    <div id="avPh" class="avph">👤</div>
  </div>
  <div class="body">
    <div class="nm" id="pName">—</div>
    <div class="pos" id="pPos"></div>
    <div id="pTags"></div>

    <div class="divider"></div>
    <div class="rows" id="pRows"></div>
  </div>
  <div class="foot">งานบริหารบุคคล · มหาวิทยาลัยราชภัฏศรีสะเกษ</div>
</div>

<div id="loading">กำลังโหลดข้อมูล...</div>
<div id="errBox" class="card" style="padding:36px 24px;">
  <div style="font-size:40px;text-align:center;margin-bottom:10px;">🔍</div>
  <div style="text-align:center;color:#64748b;font-size:14px;" id="errMsg">ไม่พบข้อมูลบุคลากร หรือลิงก์ไม่ถูกต้อง</div>
</div>

<script>
// ⚠️ วาง Web App URL ของ Google Apps Script (Code.gs) ตัวเดียวกับที่ admin.html / user.html ใช้
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzPbBVLmo5Wf9HOfJ3wCbOb8RM9MV8LAgiiQPvjQneobfUybxVFRM2mpnxxvhJ_s2I-cw/exec';

function qs(name) {
  return new URLSearchParams(location.search).get(name);
}

async function load() {
  const empId = qs('id');
  if (!empId) { showError('ไม่พบรหัสบุคลากรในลิงก์'); return; }
  if (!GAS_URL || GAS_URL.indexOf('YOUR_DEPLOYMENT_ID') !== -1) {
    showError('ระบบยังไม่ได้ตั้งค่า GAS_URL'); return;
  }
  try {
    const url = GAS_URL + '?payload=' + encodeURIComponent(JSON.stringify({ action: 'publicProfile', empId }));
    const res = await fetch(url);
    const json = await res.json();
    if (!json.ok) { showError(json.error || 'ไม่พบข้อมูล'); return; }
    render(json.data);
  } catch (e) {
    showError('เชื่อมต่อระบบไม่ได้ กรุณาลองใหม่อีกครั้ง');
  }
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('errBox').style.display = 'block';
  document.getElementById('errMsg').textContent = msg;
}

function render(p) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('mainCard').style.display = 'block';

  document.getElementById('pName').textContent = p.fullName || '-';

  const posLine = p.adminPos ? p.adminPos : (p.academicPos || 'บุคลากร');
  document.getElementById('pPos').innerHTML = '<b>' + posLine + '</b>' + (p.faculty ? ' · ' + p.faculty : '');

  if (p.photoUrl) {
    document.getElementById('avImg').src = p.photoUrl;
    document.getElementById('avImg').style.display = 'block';
    document.getElementById('avPh').style.display = 'none';
  }

  let tags = '';
  if (p.staffLine) tags += '<span class="tag">' + p.staffLine + '</span>';
  if (p.employeeType) tags += '<span class="tag">' + p.employeeType + '</span>';
  document.getElementById('pTags').innerHTML = tags;

  const rows = [];
  if (p.academicPos && p.adminPos) rows.push(['🎓', 'ตำแหน่งทางวิชาการ', p.academicPos]);
  if (p.subUnit)  rows.push(['🏢', 'สาขาวิชา/หน่วยงานย่อย', p.subUnit]);
  if (p.branch)   rows.push(['📍', 'หน่วยงานปฏิบัติงาน', p.branch]);
  if (p.phone)    rows.push(['📞', 'โทรศัพท์', p.phone]);
  if (p.email)    rows.push(['✉️', 'อีเมล', p.email]);

  document.getElementById('pRows').innerHTML = rows.map(r =>
    '<div class="row"><div class="ic">' + r[0] + '</div><div><span class="lv">' + r[1] + '</span><span class="vv">' + r[2] + '</span></div></div>'
  ).join('');
}

load();
</script>
</body>
</html>
